name: NexusFamily
version: 0.1.0
main: com.nexuscraft.nexusfamily.NexusFamily
api-version: '1.21'
author: RealSociety
description: Marry another player, have a baby villager together, watch it grow up, gear it out, and talk to it. No animations, no romance content -- just a family/social system.

commands:
  marry:
    aliases: [wedding]
    description: Propose, accept, deny, or end a marriage.
    usage: /marry <propose <player>|accept|deny|divorce|status|ring <player>>
  family:
    description: Manage and talk to your kid (the villager you look at).
    usage: /family <talk <message>|addline <line>|rename <name>|info>
  nexusfamily:
    description: Admin controls for NexusFamily.
    usage: /nexusfamily reload
    permission: nexusfamily.admin

permissions:
  nexusfamily.admin:
    description: Reload NexusFamily and manage any kid regardless of parentage.
    default: op
